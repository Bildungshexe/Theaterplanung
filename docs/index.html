<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; worker-src 'self'; manifest-src 'self'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bewertung">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#2b2b2b">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Bewertungstool – Deutsch, Geschichte, PoGe, Spanisch, Theater, P/W-Seminar</title>
<style>
  :root { --acc:#8B1E2D; --light:#F6E9EB; --gray:#E9E9E9; --line:#7f7f7f; --hit:#F3C9CF; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; }
  body { font-family: Arial, Helvetica, sans-serif; font-size: 11pt; color:#111; background:#d9d9d9; touch-action: manipulation; padding-top:env(safe-area-inset-top); }
  [contenteditable]:focus, input:focus, select:focus, textarea:focus { outline: 2px solid #3b82f6; outline-offset: 0; }
  button { font: inherit; cursor:pointer; }
  #printArea { display:none; }

  /* ---------- Werkzeugleiste ---------- */
  .toolbar { position: sticky; top:0; z-index:10; background:#2b2b2b; color:#fff; padding:8px 12px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; font-size:12pt; }
  .toolbar button, .toolbar select { font: inherit; padding:8px 12px; min-height:42px; border-radius:6px; border:1px solid #777; background:#fff; color:#111; }
  .toolbar button:active { background:#e4e4e4; }
  .toolbar .tab { background:#444; color:#fff; border-color:#666; }
  .toolbar .tab.on { background:var(--acc); border-color:var(--acc); }
  .toolbar .sep { width:1px; height:30px; background:#666; margin:0 2px; }
  .toolbar label { display:flex; gap:6px; align-items:center; }
  .backup-alert { background: #b91c1c; color: #fff; padding: 6px 10px; border-radius: 6px; font-size: 10pt; display: flex; align-items: center; gap: 8px; }
  .backup-alert button { background: #fff; color: #b91c1c; border: none; padding: 4px 8px; font-weight: bold; min-height: 0; border-radius: 4px; }

  .stage { padding:14px 10px 40px; }
  .panel { background:#fff; max-width:297mm; margin:0 auto 12px; padding:12px 16px; border-radius:6px; box-shadow:0 1px 4px rgba(0,0,0,.25); }
  .panel h2 { margin:0 0 8px; font-size:15pt; color:var(--acc); }
  .panel h3 { margin:12px 0 6px; font-size:12pt; color:var(--acc); }
  .sub { font-size:11pt; color:#444; font-weight:normal; }
  .hint { max-width:297mm; margin:0 auto 10px; color:#333; padding:0 4px; }
  .panel button, .panel select, .panel input, .panel textarea { font:inherit; padding:7px 10px; min-height:40px; border:1px solid var(--line); border-radius:5px; background:#fff; }
  .panel textarea { width:100%; min-height:110px; }
  .panel button.primary { background:var(--acc); color:#fff; border-color:var(--acc); }
  .panel button.danger { color:#a00; }
  .panel button:disabled { opacity:.4; cursor:default; }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:flex-end; margin:6px 0; }
  .row label { display:flex; flex-direction:column; gap:3px; font-size:11pt; }
  .modbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .modbar label { display:flex; gap:6px; align-items:center; }
  .modbar .sep { flex:1; }
  .chk { display:inline-flex; align-items:center; gap:4px; margin-right:8px; }
  .chk input { width:22px; height:22px; min-height:0; }
  .chip { margin:0 6px 6px 0; }
  .chip.on { background:var(--acc); color:#fff; border-color:var(--acc); }
  table.t { border-collapse:collapse; width:100%; }
  table.t th, table.t td { border:1px solid var(--line); padding:4px 6px; text-align:left; vertical-align:middle; }
  table.t th { background:var(--gray); }
  table.t td.c, table.t th.c { text-align:center; }
  table.t input, table.t select { width:100%; min-height:34px; padding:3px 6px; }
  table.t input.n { width:70px; text-align:center; }
  table.t input.g { width:60px; text-align:center; }
  .big { font-size:13pt; color:var(--acc); }
  .muted { color:#555; }
  .warn { color:#a00; }
  a { color:#0b4fa8; }

  /* ---------- Leistungsspiegel / Barometer ---------- */
  .stats-bar { display: flex; gap: 4px; height: 24px; background: var(--gray); border-radius: 4px; overflow: hidden; margin: 10px 0; }
  .stats-segment { display: flex; align-items: center; justify-content: center; color: #fff; font-size: 9pt; font-weight: bold; overflow: hidden; white-space: nowrap; text-shadow: 0 1px 1px rgba(0,0,0,0.4); }

  /* ---------- Bewertungsbogen ---------- */
  .sheet { background:#fff; width:297mm; min-height:209mm; margin:0 auto 14px; padding:6mm 8mm; box-shadow:0 2px 8px rgba(0,0,0,.3); display:grid; grid-template-rows: auto 1fr auto auto auto; gap:1.6mm; }
  .head { display:grid; grid-template-columns: auto 1.1fr 46mm 1.2fr 42mm; gap:2mm 4mm; align-items:end; }
  .head h1 { margin:0; font-size:14pt; color:var(--acc); white-space:nowrap; }
  .fld { display:flex; gap:2mm; align-items:baseline; border-bottom:1px solid var(--line); min-height:6.5mm; }
  .fld b { white-space:nowrap; }
  .fld .v { flex:1; min-width:10mm; outline:none; white-space:nowrap; overflow:hidden; }
  .fld input[type=date] { font:inherit; border:none; background:transparent; padding:0; width:100%; min-height:0; }
  @media screen { .v:empty::before { content: attr(data-ph); color:#9a9a9a; } }

  .grid { display:grid; grid-template-columns: 45mm repeat(var(--cols, 5), 1fr); border-top:1px solid var(--line); border-left:1px solid var(--line); min-height:0; }
  .grid > div { border-right:1px solid var(--line); border-bottom:1px solid var(--line); padding:1mm 1.5mm; line-height:1.15; hyphens:auto; -webkit-hyphens:auto; overflow:hidden; min-height:0; }
  .gh { background:var(--gray); font-weight:bold; text-align:center; display:flex; flex-direction:column; justify-content:center; }
  .gh span { font-weight:normal; }
  .crit { background:var(--light); display:flex; flex-direction:column; gap:1mm; justify-content:center; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .crit .cn { font-weight:bold; }
  .crit .np { display:flex; align-items:center; gap:1.5mm; }
  .crit .nv { min-width:9mm; text-align:center; font-size:15pt; color:var(--acc); }
  .crit button.st { width:9mm; height:9mm; padding:0; font-size:15pt; line-height:1; border:1px solid var(--line); border-radius:4px; background:#fff; }
  .crit button.st:active { background:#e4e4e4; }
  .crit button.st:disabled { opacity:.3; cursor:default; }
  .crit button.st.on { background:var(--acc); color:#fff; }
  .lv.na { background:#f2f2f2; }
  .lv { user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color: transparent; }
  .lv[data-act] { cursor:pointer; }
  .lv[data-act]:hover { background:#fbf3f4; }
  .lv:focus-visible { outline:2px solid #3b82f6; outline-offset:-2px; }
  .lv.hit { background:var(--hit) !important; box-shadow: inset 0 0 0 .8mm var(--acc); -webkit-print-color-adjust:exact; print-color-adjust:exact; }

  .sum { display:grid; grid-template-columns: repeat(3, auto) 1fr; border:1px solid var(--line); }
  .sum > div { padding:1.2mm 3mm; border-right:1px solid var(--line); background:var(--gray); -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .sum > div:last-child { border-right:none; }
  .cmt { display:flex; gap:2mm; border:1px solid var(--line); padding:1mm 2mm; height:14mm; }
  .cmt .v { flex:1; outline:none; overflow:hidden; line-height:1.2; }
  .foot { min-height:4.6mm; }

  .ov { background:#fff; max-width:297mm; margin:0 auto 12px; padding:6mm 8mm; }
  .ov h1 { font-size:15pt; color:var(--acc); margin:0 0 3mm; }
  .ov table { border-collapse:collapse; width:100%; }
  .ov th, .ov td { border:1px solid var(--line); padding:1.5mm 2mm; text-align:left; font-size:11pt; vertical-align:top; }
  .ov th { background:var(--gray); }
  .ov td.c { text-align:center; }

  @media screen and (max-width: 1024px) {
    .sheet { width: 100%; min-height: auto; display: block; overflow-x: auto; }
    .head { grid-template-columns: 1fr; gap: 4px; }
    .grid { grid-template-columns: 1fr; }
    .grid > div { border-right: 1px solid var(--line); }
    .sum { grid-template-columns: 1fr; }
    .sum > div { border-bottom: 1px solid var(--line); border-right: none; }
  }

  /* ---------- Druckansicht in der App ---------- */
  #printArea.open { display:block; position:fixed; top:0; left:0; right:0; bottom:0; z-index:100; overflow:auto; background:#d9d9d9; }
  .printbar { position:sticky; top:0; z-index:1; background:#2b2b2b; padding:8px 12px; display:flex; flex-wrap:wrap; gap:8px; }
  .printbar button { font:inherit; padding:8px 12px; min-height:42px; border-radius:6px; border:1px solid #777; background:#fff; color:#111; }
  .printbar button.primary { background:var(--acc); color:#fff; border-color:var(--acc); }
  .printdoc { padding:14px 10px 40px; }
  .rep table { border-collapse:collapse; width:100%; font-size:11pt; margin:0 auto 6mm; }
  .rep th, .rep td { border:1px solid var(--line); padding:2mm; text-align:left; vertical-align:top; }
  .rep th { background:var(--gray); font-weight:bold; }
  .rep td.c, .rep th.c { text-align:center; }

  .toolbar { transition: background .2s; flex-wrap:nowrap; font-size:11pt; gap:6px; padding:6px 8px; overflow-x:auto; }
  .toolbar > * { flex:0 0 auto; }
  .toolbar button, .toolbar select { padding:6px 8px; min-height:38px; }
  .toolbar label { background:#fff; color:#111; padding:4px 8px; border-radius:6px; }
  .toolbar label select { min-height:30px; padding:4px 6px; }
  #clsSel { max-width:100px; } #stuSel { max-width:130px; } #modeSel { max-width:200px; }
  .toolbar .sep { display:none; }
  #backupWarnContainer:empty { display:none; }
  #backupWarnContainer .backup-alert { display:inline-flex; }
  .toolbar .tab { background:rgba(0,0,0,.35); border-color:rgba(255,255,255,.6); }
  .toolbar .tab.on { background:#fff; color:#111; border-color:#fff; }
  .clsdot { display:inline-block; width:14px; height:14px; border-radius:3px; margin-right:6px; vertical-align:middle; }
  .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .drawer { background:#fafafa; }
  .drawer > button { font-weight:bold; }

  @page { size: A4 landscape; margin: 0; }
  @media print {
    body { background:#fff; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    #app { display:none !important; }
    #printArea { display:block !important; position:static !important; background:#fff !important; }
    .printbar { display:none !important; }
    .printdoc { padding:0 !important; }
    #printArea .sheet { box-shadow:none; margin:0; width:297mm; height:209mm; min-height:0; overflow:hidden; break-after:page; display:grid !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    #printArea .sheet:last-child { break-after:auto; }
    #printArea .head { display:grid !important; grid-template-columns: auto 1.1fr 46mm 1.2fr 42mm !important; }
    #printArea .grid { display:grid !important; grid-template-columns: 45mm repeat(var(--cols, 5), 1fr) !important; }
    #printArea .sum { display:grid !important; grid-template-columns: repeat(3, auto) 1fr !important; }
    #printArea .ov { max-width:none; width:297mm; margin:0; }
    .crit button.st { display:none !important; }
    .crit, .gh, .sum > div, .lv.hit { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  }
</style>
</head>
<body>
<div id="app">
  <div class="toolbar" id="toolbar">
    <select id="clsSel" aria-label="Klasse"></select>
    <button id="stuPrev" title="Vorherige/r">◀</button>
    <select id="stuSel"></select>
    <button id="stuNext" title="Nächste/r">▶</button>
    <span class="sep"></span>
    <select id="modeSel" aria-label="Bewertung"></select>
    <button class="tab" data-tab="bogen">Bogen</button>
    <span class="sep"></span>
    <button class="tab" data-tab="student">Notenliste</button>
    <button class="tab" data-tab="klasse">Übersicht</button>
    <span class="sep"></span>
    <button class="tab" data-tab="classes">Klassen</button>
    <button class="tab" data-tab="settings">Einstellungen</button>
  </div>
  <div id="backupWarnContainer" style="padding:4px 8px"></div>
  <div class="stage" id="view"></div>
</div>
<div id="printArea"></div>
<input type="file" id="file" accept="application/json,.json" style="display:none">

<script>
(function () {
  'use strict';

  var LV = [
    { n:'sehr gut',                np:'15–13', hi:15, lo:13, def:14 },
    { n:'gut',                     np:'12–10', hi:12, lo:10, def:11 },
    { n:'befriedigend',            np:'9–7',   hi:9,  lo:7,  def:8  },
    { n:'ausreichend',             np:'6–4',   hi:6,  lo:4,  def:5  },
    { n:'mangelhaft / ungenügend', np:'3–0',   hi:3,  lo:0,  def:2  }
  ];

  var C = {
    // Lesevortrag & Gedicht (unter 7 Kriterien -> 2 zusätzliche Kriterien ergänzt)
    gen:  { n:'Lesegenauigkeit', d:['Alle Wörter genau gelesen; Fehler werden erkannt und selbst korrigiert.','Meist genau; wenige Fehler, meist selbst korrigiert.','Einzelne Lesefehler oder Auslassungen; Verständnis bleibt gesichert.','Viele Lesefehler, Auslassungen oder erfundene Wörter.','Sehr fehlerhaft; Text kaum erkennbar.'] },
    fluss:{ n:'Leseflüssigkeit und Tempo', d:['Flüssig in Sinneinheiten; Tempo passt zum Inhalt und wird gezielt variiert.','Überwiegend flüssig; seltenes Stocken; Tempo meist passend.','Teils Wort für Wort; gelegentlich Stocken oder Wiederholungen; Tempo schwankt.','Häufiges Stocken, Wiederholungen, falsche Anfänge; zu langsam oder gehetzt.','Abgehackt mit vielen Pausen; kaum zu folgen.'] },
    bet:  { n:'Betonung und Satzmelodie', d:['Betont sinnvoll; Satzzeichen, Frage und Ausruf hörbar umgesetzt; Stimme variiert.','Meist sinnvoll betont; Satzzeichen weitgehend beachtet.','Betonung nur teilweise passend; Satzmelodie eher gleichförmig.','Kaum Betonung; monoton; Satzzeichen oft ignoriert.','Völlig flach; keine erkennbare Sinnbetonung.'] },
    gest: { n:'Pausen, Lautstärke und Ausdruck', d:['Pausen an Sinngrenzen; Lautstärke und Ausdruck passen zur Stelle.','Pausen und Lautstärke meist passend; Ausdruck erkennbar.','Pausen oder Lautstärke teils unpassend; Ausdruck zurückhaltend.','Pausen fehlen oder stören; zu leise oder zu laut; kaum Ausdruck.','Kaum hörbar oder unpassend; keine Gestaltung.'] },
    verst:{ n:'Textverständnis im Vortrag', d:['Inhalt, Stimmung und Figuren hörbar verstanden und gestaltet.','Inhalt erkennbar verstanden; Gestaltung meist passend zum Text.','Inhalt im Wesentlichen verstanden; Gestaltung wenig inhaltsbezogen.','Verständnis lückenhaft; Gestaltung passt oft nicht zum Text.','Kein Textverständnis erkennbar.'] },
    aus:  { n:'Aussprache und Lautbildung', d:['Laute, Wortakzent und Aussprache durchgehend korrekt und natürlich.','Überwiegend korrekt; einzelne Fehler ohne Verständnisstörung.','Wiederkehrende Fehler, Verständnis nie gefährdet; deutsch geprägt.','Häufige Fehler; Verständnis teils erschwert.','Stark fehlerhaft; kaum verständlich.'],
            es:['Durchgehend korrekt (r/rr, j, ll, ñ, b/v, Wortakzent); natürlich.','Überwiegend korrekt; einzelne Fehler bei r/rr, j oder ll.','Wiederkehrende Fehler bei typischen Lauten; deutsch geprägt; verständlich.','Häufige Fehler, auch beim Wortakzent; Verständnis teils erschwert.','Stark fehlerhaft; kaum verständlich.'] },
    inton:{ n:'Stimmführung & Modulation', d:['Äußerst differenzierter Einsatz der Stimme zur Spannungssteuerung.','Stimme lebendig geführt; passende Modulation.','Stimme wechselt zwischen ausdrucksstark und gleichförmig.','Kaum Modulation; recht eintönig.','Völlig monotone Stimmführung.'] },
    atmos:{ n:'Atmosphäre & Raumwirkung', d:['Zieht das Publikum vom ersten Moment an in den Bann.','Erzeugt eine spürbare, passende Atmosphäre.','Atmosphäre bricht zeitweise ein.','Kaum stimmungsvoll.','Keine Wirkung im Raum.'] },

    tex:  { n:'Textsicherheit', d:['Vollständig auswendig, ohne Hilfe und fehlerfrei.','Sicher; kleine Fehler selbst korrigiert; keine Hilfe nötig.','Einzelne Stockungen oder Fehler; ein- bis zweimal Hilfe.','Mehrfach Aussetzer; deutliche Hilfen nötig.','Text nicht beherrscht; Vortrag bricht ab.'] },
    spr:  { n:'Deutlichkeit, Lautstärke und Tempo', d:['Klar und gut verständlich; Lautstärke und Tempo passen und werden gezielt variiert.','Meist klar; Lautstärke und Tempo überwiegend passend.','Teils undeutlich, zu leise oder zu schnell bzw. langsam.','Oft undeutlich; Lautstärke oder Tempo stören den Vortrag.','Kaum verständlich oder nicht hörbar.'] },
    vers: { n:'Betonung, Rhythmus und Pausen', d:['Betonung trifft den Sinn; Rhythmus und Reim hörbar; Pausen an passenden Stellen.','Betonung meist sinnvoll; Rhythmus erkennbar; Pausen meist passend.','Betonung nur teilweise passend; Rhythmus wackelig; Pausen zufällig.','Kaum Betonung; leiert oder Wort für Wort; Pausen unpassend.','Keine Gestaltung; Vers wird heruntergesprochen.'] },
    sinn: { n:'Sinngestaltung und Ausdruck', d:['Stimmung und Aussage werden hörbar; Stimmlage und Melodie lebendig variiert.','Stimmung meist erkennbar; Stimme abwechslungsreich.','Ansätze von Gestaltung; Stimme eher gleichförmig.','Monoton; Inhalt wird kaum gestaltet.','Keine erkennbare Gestaltung.'] },
    auft: { n:'Auftreten: Haltung, Blick, Mimik, Gestik', d:['Ruhiger Stand, Blick zum Publikum, gezielte Mimik und Gestik; Titel und Autor/in genannt.','Sicheres Auftreten; Blick meist beim Publikum; Mimik und Gestik passend.','Unruhiger Stand; wenig Blickkontakt; Mimik und Gestik zufällig.','Wirkt unsicher; Blick auf Boden oder Manuskript; keine Gestik.','Kein sicherer Auftritt; abgewandt oder abgebrochen.'] },
    einf: { n:'Einführung und Inhalt', d:['Nennt Titel und Autor/in; fasst den Inhalt in der Zielsprache sicher zusammen.','Nennt Titel und Autor/in; Inhalt weitgehend richtig erklärt.','Einführung knapp; Inhalt nur teilweise erklärt.','Einführung lückenhaft; Inhalt kaum verständlich erklärt.','Keine Einführung; Inhalt nicht erklärt.'] },
    korpo:{ n:'Körpersprache & Raumpräsenz', d:['Körpersprache unterstützt das gesprochene Wort absolut stimmig.','Sichere und offene Körpersprache.','Körperhaltung zu starr oder unruhig.','Unsichere Gestik; abgewandt.','Keine Raumpräsenz.'] },
    empa: { n:'Empathie & Textidentifikation', d:['Identifiziert sich vollkommen mit der Intention des Autors.','Guter emotionaler Zugang zum Werk.','Zugang zum Text wirkt konstruiert.','Kaum innerer Bezug zum Text erkennbar.','Völlig hölzerne Darbietung.'] },

    // Unterrichtsbeitrag (unter 7 Kriterien -> 2 zusätzliche Kriterien ergänzt)
    u1: { n:'Häufigkeit und Verlässlichkeit', d:['Beteiligt sich regelmäßig von sich aus.','Beteiligt sich häufig, auch ohne Aufforderung.','Beteiligt sich gelegentlich, meist auf Aufforderung.','Beteiligt sich selten; nur auf direkte Ansprache.','Keine erkennbare Beteiligung.'] },
    u2: { n:'Fachliche Qualität', d:['Treffend, differenziert und fachlich richtig.','Meist richtig und zum Thema passend.','Teilweise richtig; Kernaussage erkennbar.','Oft ungenau oder falsch.','Fachlich nicht verwertbar.'] },
    u3: { n:'Selbstständigkeit und Transfer', d:['Stellt Zusammenhänge her, überträgt auf Neues, bringt eigene Ideen ein.','Verknüpft Gelerntes meist sinnvoll.','Gibt Gelerntes wieder; wenig Eigenes.','Braucht viele Hilfen; reproduziert Bruchstücke.','Kein selbstständiger Beitrag.'] },
    u4: { n:'Sprache und Fachsprache', d:['Klar, präzise, fachsprachlich sicher.','Verständlich, meist fachsprachlich korrekt.','Verständlich, aber ungenau; wenig Fachsprache.','Schwer verständlich; Fachbegriffe fehlen.','Kaum verständlich.'] },
    u5: { n:'Gesprächsverhalten', d:['Hört zu, greift Beiträge anderer auf, argumentiert sachlich.','Geht meist auf andere ein.','Äußert sich ohne Bezug zu anderen.','Unterbricht oder stört gelegentlich.','Stört häufig; hört nicht zu.'] },
    u6: { n:'Konstruktive Kooperation', d:['Fördert die Zusammenarbeit in Partner- und Gruppenphasen vorbildlich.','Kooperiert zuverlässig mit anderen.','Arbeitet mit, bleibt aber passiv in der Gruppe.','Beteiligt sich unzureichend an Gruppenarbeit.','Stört kooperatives Arbeiten.'] },
    u7: { n:'Fehlerkultur & Reflexion', d:['Geht konstruktiv mit eigenen und fremden Fehlern um; reflektiert tiefgehend.','Reflektiert Ergebnisse sachlich.','Akzeptiert Korrekturen nur zögerlich.','Schwer belehrbar bei Fehlern.','Völlig uneinsichtig.'] },

    // Umfangreiche Module (> 7 Kriterien) – urspünglicher, kompakter Standard (rückgängig gemacht)
    th_schauspiel: { n:'Schauspiel', d:['Rolle tief durchdrungen, körperlich und sprachlich überzeugend, hochgradig wandelbar und authentisch.','Gute schauspielerische Leistung, Text und Rolle sicher umgesetzt.','Rolle erkennbar, gelegentlich noch etwas steif oder unsicher in der Umsetzung.','Wenig Ausdruck im Spiel; agiert oft hölzern oder unbeteiligt.','Keine erkennbare schauspielerische Gestaltung.'] },

    th_buehne: { n:'Bühnenbild', d:['Bühnenbild und Requisiten kreativ, funktional und konzeptionell stark durchdacht eingesetzt.','Sorgfältig gestaltetes Bühnenbild, das die Szene gut unterstützt.','Einfaches Bühnenbild; Erfüllung des Mindeststandards.','Bühnenbild lückenhaft, unpraktisch oder stört den Ablauf.','Kein Bühnenbild oder völlig ungeeignet.'] },

  function applyWPreset(a, id) {
    var W = WG[a.type], mk = modKey(a), crs = critsOf(a), nw = {};

    if (id === 'std') {

    } else {
      var pr = null; W.p.forEach(function (p) { if (p[0] === id) pr = p; });
      var cnt = {}; crs.forEach(function (k) { var g = wGroup(a.type, k.id); cnt[g] = (cnt[g] || 0) + 1; });
      var tot = 0; Object.keys(cnt).forEach(function (g) { tot += pr ? (pr[2][g] || 0) : cnt[g]; });
      if (!tot) tot = 1;
      crs.forEach(function (k) {

  function setLevel(a, id, k) { var cur = a.pts[id]; a.pts[id] = (cur !== undefined && cur !== null && lvOf(cur) === k) ? null : LV[k].def; if (a.pts[id] === null) delete a.pts[id]; }
  function stepPts(a, id, d) { var cur = a.pts[id]; if (cur === undefined || cur === null) return; var L = LV[lvOf(cur)]; a.pts[id] = Math.max(L.lo, Math.min(L.hi, cur + d)); }
  function gotoStu(id) { var c = cls(); if (c) { c.stu = id; save(); render(); } }

  document.addEventListener('DOMContentLoaded', function () {

    $('stuSel').addEventListener('change', function (e) { gotoStu(e.target.value); });
    function move(d) { var c = cls(); if (!c || !c.students.length) return; var i = 0; c.students.forEach(function (s, j) { if (s.id === c.stu) i = j; }); var n = Math.max(0, Math.min(c.students.length - 1, i + d)); gotoStu(c.students[n].id); }

    view.addEventListener('click', function (e) {
      var el = e.target.closest('[data-act]'); if (!el || el.disabled) return;

      }

      if (act === 'delA') {
        var a2 = curA(type); if (a2._draft) return;
        if (!confirm('Diese Bewertung wirklich löschen?')) return;
        c.assessments = c.assessments.filter(function (x) { return x.id !== a2.id; }); delete ui.cur[type + vk(type) + '|' + s.id]; save(); render(); return;

      if (act === 'drawer') {

      }
      if (act === 'sOwn') { ui.sOpen[el.dataset.mk] = !ui.sOpen[el.dataset.mk]; render(); return; }
      if (act === 'mSave') {

        var ca = curA(type); if (!ca.sel || !ca.sel.length) { alert('Bitte zuerst Kriterien wählen.'); return; }
        var mks = modKey(ca), wv = {};

      if (act === 'wApplyAll') {

        c.students.forEach(function (stud) {

      if (act === 'openE') { var ao = findA(c, el.dataset.id); if (!ao) return; if (MOD[ao.type].vars) setVar(ao.type, ao.variant); state.mt = ao.type; ui.cur[keyA(ao)] = ao.id; state.tab = ao.type; save(); render(); return; }

      if (act === 'clsDel') {
        if (!confirm('Klasse „' + c.name + '“ löschen?')) return;

        var lines = $('paste').value.split(/\r?\n/).map(function (x) { return x.trim(); }).filter(Boolean);

      if (act === 'stuSort') { c.students.sort(function (x, y) { return x.name.localeCompare(y.name, 'de'); }); save(); render(); return; }
      if (act === 'stuDel') {
        var st = stuById(c, el.dataset.sid);

        c.assessments = c.assessments.filter(function (x) { return x.sid !== el.dataset.sid; });

      if (act === 'wOwn') { ui.wOpen[el.dataset.mk] = !ui.wOpen[el.dataset.mk]; render(); return; }

        state.lastBackup = new Date().toISOString();

    view.addEventListener('input', function (e) {
      var t = e.target, c = cls(); if (!c) return;

        var sh = t.closest('.sheet'), a = findAny(c, sh.dataset.aid); if (!a) return;

          sa = (ensure(c, sa), sa); sa.pts = {};
        }
        ensure(c, sa);
        ui.drawer[modKey(sa)] = true;
        if (key === 't4' || key === 't5') sa[key] = num(t.value, key === 't4' ? 50 : 33);
        else if (key === 'bmax') sa.bmax = +t.value;
        else sa[key] = t.value;
        save(); render(); return;
      }
      if (t.dataset.bmx !== undefined) { var sb = curA(state.tab); ensure(c, sb); sb.bmx = sb.bmx || {}; sb.bmx[t.dataset.bmx] = +t.value; save(); render(); return; }
      if (t.dataset.cdef !== undefined) {
        c.def = cdefOf(c.def); var dk = t.dataset.cdef;
        if (dk === 'bmax') c.def.bmax = +t.value; else if (dk === 't4' || dk === 't5') c.def[dk] = num(t.value, 50); else c.def[dk] = t.value;
        c.def = cdefOf(c.def); save(); render(); return;
      }
      if (t.dataset.cf !== undefined) { c[t.dataset.cf] = t.value; save(); render(); return; }
      if (t.dataset.w !== undefined) {
        var wa = curA(state.tab), wid = t.dataset.w.split('/').pop();
        if (wa && wa.fz) wa.fz.forEach(function (it) { if (it.id === wid) it.w = num(t.value, 0); });
        else state.w[t.dataset.w] = num(t.value, 0);
        state.wp[t.dataset.w.split('/')[0]] = 'eigen'; save(); render(); return;
      }
      if (t.dataset.sf !== undefined) { var st = stuById(c, t.dataset.sid); if (st) { st.name = t.value; save(); } return; }
      if (t.dataset.f === 'sw') {
        var sw0 = curA(state.tab); ensure(c, sw0);
        var areas = [];
        view.querySelectorAll('input[data-f="sw"]:checked').forEach(function (b2) { areas.push(b2.value); });
        ui.drawer[modKey(sw0)] = true; sw0.sw = areas;
        sw0.sel = areaSel(areas).concat((sw0.sel || []).filter(function (id) { return id.indexOf('x_') === 0; }));
        refreshFz(sw0); save(); render(); return;
      }
      if (t.dataset.f === 'pickA') { var s = stu(); if (t.value !== '__draft') { ui.cur[state.tab + vk(state.tab) + '|' + s.id] = t.value; render(); } return; }
      if (t.dataset.f === 'sel') {
        var a = curA(state.tab); ensure(c, a);
        var pool = POOL[a.type][poolKeyOf(a)] || [];
        var active = [];
        view.querySelectorAll('input[data-f="sel"]:checked').forEach(function(box) { active.push(box.value); });
        ui.drawer[modKey(a)] = true; a.sel = active.concat((a.sel || []).filter(function (id) { return id.indexOf('x_') === 0; }));
        refreshFz(a); save(); render(); return;
      }
    });

    $('file').addEventListener('change', function (e) {
      var f = e.target.files[0]; if (!f) return;
      var r = new FileReader();
      r.onload = function () {
        try {
          var o = sanitize(JSON.parse(r.result)); if (!o) throw new Error('leer');
          if (!confirm('Daten überschreiben?')) return;
          state = o; ui = { draft:{}, cur:{}, fresh:{}, wOpen:{}, sOpen:{}, drawer:{} }; migrate(); save(); render();
        } catch (err) { alert('Fehler beim Laden.'); }

    });

    render();
  });
})();
