<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bewertungstool – Song, Lesen, Gedicht, Abfrage, Unterricht, Theater</title>
<style>
  :root { --acc:#8B1E2D; --light:#F6E9EB; --gray:#E9E9E9; --line:#7f7f7f; --hit:#F3C9CF; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; }
  body { font-family: Arial, Helvetica, sans-serif; font-size: 11pt; color:#111; background:#d9d9d9; touch-action: manipulation; }
  [contenteditable]:focus, input:focus, select:focus, textarea:focus { outline: 2px solid #3b82f6; outline-offset: 0; }
  button { font: inherit; cursor:pointer; }
  #printArea { display:none; }

  /* ---------- Werkzeugleiste ---------- */
  .toolbar { position: sticky; top:0; z-index:10; background:#2b2b2b; color:#fff; padding:8px 12px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; font-size:12pt; }
  .toolbar button, .toolbar select { font: inherit; padding:8px 12px; min-height:42px; border-radius:6px; border:1px solid #777; background:#fff; color:#111; }
  .toolbar button:active { background:#e4e4e4; }
  .toolbar .tab { background:#444; color:#fff; border-color:#666; }
  .toolbar .tab.on { background:var(--acc); border-color:var(--acc); }
  .toolbar .sep { width:1px; height:30px; background:#666; margin:0 2px; }
  .toolbar label { display:flex; gap:6px; align-items:center; }
  .stage { padding:14px 10px 40px; }
  .panel { background:#fff; max-width:297mm; margin:0 auto 12px; padding:12px 16px; border-radius:6px; box-shadow:0 1px 4px rgba(0,0,0,.25); }
  .panel h2 { margin:0 0 8px; font-size:15pt; color:var(--acc); }
  .panel h3 { margin:12px 0 6px; font-size:12pt; color:var(--acc); }
  .sub { font-size:11pt; color:#444; font-weight:normal; }
  .hint { max-width:297mm; margin:0 auto 10px; color:#333; padding:0 4px; }
  .panel button, .panel select, .panel input, .panel textarea { font:inherit; padding:7px 10px; min-height:40px; border:1px solid var(--line); border-radius:5px; background:#fff; }
  .panel textarea { width:100%; min-height:110px; }
  .panel button.primary { background:var(--acc); color:#fff; border-color:var(--acc); }
  .panel button.danger { color:#a00; }
  .panel button:disabled { opacity:.4; cursor:default; }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:flex-end; margin:6px 0; }
  .row label { display:flex; flex-direction:column; gap:3px; font-size:11pt; }
  .modbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .modbar label { display:flex; gap:6px; align-items:center; }
  .modbar .sep { flex:1; }
  .chk { display:inline-flex; align-items:center; gap:4px; margin-right:8px; }
  .chk input { width:22px; height:22px; min-height:0; }
  .chip { margin:0 6px 6px 0; }
  .chip.on { background:var(--acc); color:#fff; border-color:var(--acc); }
  table.t { border-collapse:collapse; width:100%; }
  table.t th, table.t td { border:1px solid var(--line); padding:4px 6px; text-align:left; vertical-align:middle; }
  table.t th { background:var(--gray); }
  table.t td.c, table.t th.c { text-align:center; }
  table.t input { width:100%; min-height:34px; padding:3px 6px; }
  table.t input.n { width:70px; text-align:center; }
  table.t input.g { width:60px; text-align:center; }
  .big { font-size:13pt; color:var(--acc); }
  .chips span { display:inline-block; border:1px solid var(--line); border-radius:12px; padding:1px 8px; margin:2px 4px 2px 0; background:#fff; white-space:nowrap; }
  .muted { color:#555; }
  .warn { color:#a00; }
  a { color:#0b4fa8; }

  /* ---------- Bewertungsbogen ---------- */
  .sheet { background:#fff; width:297mm; min-height:209mm; margin:0 auto 14px; padding:6mm 8mm; box-shadow:0 2px 8px rgba(0,0,0,.3); display:grid; grid-template-rows: auto 1fr auto auto auto; gap:1.6mm; }
  .head { display:grid; grid-template-columns: auto 1.1fr 46mm 1.2fr 42mm; gap:2mm 4mm; align-items:end; }
  .head h1 { margin:0; font-size:14pt; color:var(--acc); white-space:nowrap; }
  .fld { display:flex; gap:2mm; align-items:baseline; border-bottom:1px solid var(--line); min-height:6.5mm; }
  .fld b { white-space:nowrap; }
  .fld .v { flex:1; min-width:10mm; outline:none; white-space:nowrap; overflow:hidden; }
  .fld input[type=date] { font:inherit; border:none; background:transparent; padding:0; width:100%; min-height:0; }
  @media screen { .v:empty::before { content: attr(data-ph); color:#9a9a9a; } }

  .grid { display:grid; grid-template-columns: 45mm repeat(5, 1fr); border-top:1px solid var(--line); border-left:1px solid var(--line); min-height:0; }
  .grid > div { border-right:1px solid var(--line); border-bottom:1px solid var(--line); padding:1mm 1.5mm; line-height:1.15; hyphens:auto; -webkit-hyphens:auto; overflow:hidden; min-height:0; }
  .gh { background:var(--gray); font-weight:bold; text-align:center; display:flex; flex-direction:column; justify-content:center; }
  .gh span { font-weight:normal; }
  .crit { background:var(--light); display:flex; flex-direction:column; gap:1mm; justify-content:center; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .crit .cn { font-weight:bold; }
  .crit .np { display:flex; align-items:center; gap:1.5mm; }
  .crit .nv { min-width:9mm; text-align:center; font-size:15pt; color:var(--acc); }
  .crit button.st { width:9mm; height:9mm; padding:0; font-size:15pt; line-height:1; border:1px solid var(--line); border-radius:4px; background:#fff; }
  .crit button.st:active { background:#e4e4e4; }
  .crit button.st:disabled { opacity:.3; cursor:default; }
  .lv { user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color: transparent; }
  .lv[data-act] { cursor:pointer; }
  .lv[data-act]:hover { background:#fbf3f4; }
  .lv:focus-visible { outline:2px solid #3b82f6; outline-offset:-2px; }
  .lv.hit { background:var(--hit) !important; box-shadow: inset 0 0 0 .8mm var(--acc); -webkit-print-color-adjust:exact; print-color-adjust:exact; }

  .sum { display:grid; grid-template-columns: repeat(3, auto) 1fr; border:1px solid var(--line); }
  .sum > div { padding:1.2mm 3mm; border-right:1px solid var(--line); background:var(--gray); -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .sum > div:last-child { border-right:none; }
  .cmt { display:flex; gap:2mm; border:1px solid var(--line); padding:1mm 2mm; height:14mm; }
  .cmt .v { flex:1; outline:none; overflow:hidden; line-height:1.2; }
  .foot { min-height:4.6mm; }

  /* ---------- Übersichten ---------- */
  .ov { background:#fff; max-width:297mm; margin:0 auto 12px; padding:6mm 8mm; }
  .ov h1 { font-size:15pt; color:var(--acc); margin:0 0 3mm; }
  .ov table { border-collapse:collapse; width:100%; }
  .ov th, .ov td { border:1px solid var(--line); padding:1.5mm 2mm; text-align:left; font-size:11pt; vertical-align:top; }
  .ov th { background:var(--gray); }
  .ov td.c { text-align:center; }

  /* ---------- Druck ---------- */
  @page { size: A4 landscape; margin: 0; }
  @media print {
    body { background:#fff; }
    #app { display:none !important; }
    body.printing #printArea { display:block; }
    #printArea .sheet { box-shadow:none; margin:0; width:297mm; height:209mm; min-height:0; overflow:hidden; break-after:page; }
    #printArea .sheet:last-child { break-after:auto; }
    #printArea .ov { max-width:none; width:297mm; margin:0; }
    .crit button.st { display:none !important; }
  }
</style>
</head>
<body>
<div id="app">
  <div class="toolbar" id="toolbar">
    <label>Klasse <select id="clsSel"></select></label>
    <button id="stuPrev" title="Vorherige/r">◀</button>
    <select id="stuSel"></select>
    <button id="stuNext" title="Nächste/r">▶</button>
    <span class="sep"></span>
    <label>Bewertung <select id="modeSel"></select></label>
    <button class="tab" data-tab="bogen">Bogen</button>
    <span class="sep"></span>
    <button class="tab" data-tab="student">Schüler/in</button>
    <button class="tab" data-tab="klasse">Klassenübersicht</button>
    <span class="sep"></span>
    <button class="tab" data-tab="classes">Klassen</button>
    <button class="tab" data-tab="settings">Einstellungen</button>
  </div>
  <div class="stage" id="view"></div>
</div>
<div id="printArea"></div>
<input type="file" id="file" accept="application/json,.json" style="display:none">
<input type="file" id="fileSong" accept="application/json,.json" style="display:none">

        var a2 = curA(type); if (a2._draft) return;
        if (!confirm('Diese Bewertung wirklich löschen?')) return;
        c.assessments = c.assessments.filter(function (x) { return x.id !== a2.id; }); delete ui.cur[type + vk(type) + '|' + s.id]; save(); render(); return;
      }
      if (act === 'printOne') { var a3 = curA(type); printHTML(sheetHTML(c, s, a3, false)); return; }
      if (act === 'printAll') {
        var all = []; c.students.forEach(function (st) { assessmentsOf(c, st.id, type).forEach(function (x) { all.push(sheetHTML(c, st, x, false)); }); });
        if (!all.length) { alert('Es gibt noch keine gespeicherten Bewertungen dieser Art in dieser Klasse.'); return; }
        printHTML(all.join('')); return;
      }
      if (act === 'printStu') { printHTML(studentOverviewHTML(c, s)); return; }
      if (act === 'printCls') { printHTML(classOverviewHTML(c)); return; }
      if (act === 'csv') { exportCsv(); return; }
      if (act === 'openE') { var ao = findA(c, el.dataset.id); if (!ao) return; if (MOD[ao.type].vars) state.vr = ao.variant; state.mt = ao.type; ui.cur[keyA(ao)] = ao.id; state.tab = ao.type; save(); render(); return; }
      if (act === 'delE') {
        if (!confirm('Diesen Eintrag wirklich löschen?')) return;
        if (el.dataset.k === 'm') c.manual = c.manual.filter(function (x) { return x.id !== el.dataset.id; });
        else { c.assessments = c.assessments.filter(function (x) { return x.id !== el.dataset.id; }); Object.keys(ui.cur).forEach(function (k) { if (ui.cur[k] === el.dataset.id) delete ui.cur[k]; }); }
        save(); render(); return;
      }
      if (act === 'addNote') {
        var v = num($('nf-val').value, null), max = c.skala === 'np' ? 15 : 6, min = c.skala === 'np' ? 0 : 1;
        if (v === null || v < min || v > max) { alert((c.skala === 'np' ? 'Bitte Notenpunkte von 0 bis 15' : 'Bitte eine Note von 1 bis 6') + ' eintragen.'); return; }
        var src = $('nf-src').value.trim(); if (!src) { alert('Bitte die Quelle der Note angeben (z. B. Referat).'); return; }
        c.manual.push({ id:uid('m'), sid:s.id, date:$('nf-date').value || todayISO(), source:src, thema:$('nf-thema').value.trim(), value:v, gew:Math.max(0, num($('nf-gew').value, 1)) });
        save(); render(); return;
      }
      if (act === 'clsPick') { state.cls = el.dataset.id; save(); render(); return; }
      if (act === 'clsAdd') { var nc = { id:uid('c'), name:'Neue Klasse', fach:'', typ:'de', skala:'note', students:[], stu:null, assessments:[], manual:[] }; state.classes.push(nc); state.cls = nc.id; save(); render(); return; }
      if (act === 'clsDel') {
        if (!confirm('Klasse „' + c.name + '“ mit allen Schüler/innen, Bewertungen und Noten löschen?')) return;
        state.classes = state.classes.filter(function (x) { return x.id !== c.id; }); state.cls = state.classes[0] ? state.classes[0].id : null; save(); render(); return;
      }
      if (act === 'stuAdd') {
        var lines = $('paste').value.split(/\r?\n/).map(function (x) { return x.trim(); }).filter(Boolean);
        if (!lines.length) return;
        lines.forEach(function (n) { c.students.push({ id:uid('s'), name:n }); });
        if (!c.stu) c.stu = c.students[0].id; save(); render(); return;
      }
      if (act === 'stuSort') { c.students.sort(function (x, y) { return x.name.localeCompare(y.name, 'de'); }); save(); render(); return; }
      if (act === 'stuDel') {
        var st = stuById(c, el.dataset.sid);
        if (!confirm('„' + (st ? st.name : '') + '“ samt aller Bewertungen und Noten löschen?')) return;
        c.students = c.students.filter(function (x) { return x.id !== el.dataset.sid; });
        c.assessments = c.assessments.filter(function (x) { return x.sid !== el.dataset.sid; });
        c.manual = c.manual.filter(function (x) { return x.sid !== el.dataset.sid; });
        if (c.stu === el.dataset.sid) c.stu = c.students[0] ? c.students[0].id : null; save(); render(); return;
      }
      if (act === 'wReset') { state.w = {}; save(); render(); return; }
      if (act === 'exp') { download('muendliche_noten_' + todayISO() + '.json', JSON.stringify(state, null, 2), 'application/json'); return; }
      if (act === 'imp') { $('file').click(); return; }
      if (act === 'impSong') { if (!c) { alert('Bitte zuerst eine Klasse anlegen und auswählen.'); return; } $('fileSong').click(); return; }
    });

    function onField(e) {
      var t = e.target, c = cls(), s = stu();
      if (t.dataset.cf !== undefined && c) { c[t.dataset.cf] = t.value; save(); renderBar(); return; }
      if (t.dataset.sf !== undefined && c) { var st = stuById(c, t.dataset.sid); if (st) { st.name = t.value; save(); renderBar(); } return; }
      if (t.dataset.w !== undefined) { state.w[t.dataset.w] = Math.max(0, num(t.value, 0)); save(); return; }
      if (t.dataset.ef !== undefined && c) {
        var id = t.dataset.id, f = t.dataset.ef, obj = null;
        c.manual.forEach(function (x) { if (x.id === id) obj = x; });
        if (!obj) { c.assessments.forEach(function (x) { if (x.id === id) obj = x; }); }
        if (!obj) return;
        if (f === 'gew') obj.gew = Math.max(0, num(t.value, 1));
        else if (f === 'value') { var v = num(t.value, null); var mx = c.skala === 'np' ? 15 : 6, mn = c.skala === 'np' ? 0 : 1; obj.value = (v === null) ? null : Math.max(mn, Math.min(mx, v)); }
        else obj[f] = t.value;
        save(); return;
      }
      var sh = t.closest && t.closest('.sheet'); if (!sh || !c) return;
      var a = findAny(c, sh.dataset.aid); if (!a) return;
      var f2 = t.dataset.f;
      if (f2 === 'pickA') { if (t.value !== '__draft') { ui.cur[keyA(a)] = t.value; render(); } return; }
    }
    view.addEventListener('input', function (e) {
      var t = e.target, c = cls(); if (!c) return;
      if (t.isContentEditable && t.dataset.f) {
        var sh = t.closest('.sheet'), a = findAny(c, sh.dataset.aid); if (!a) return;
        ensure(c, a); a[t.dataset.f] = t.innerText.replace(/\n+$/, ''); save();
        if (t.dataset.f === 'thema' || t.dataset.f === 'date') { var op = document.querySelector('[data-f="pickA"] option:checked'); if (op) { op.value = a.id; op.textContent = fd(a.date) + ' – ' + (a.thema || 'ohne Thema'); } }
      }
    });
    view.addEventListener('change', function (e) {
      var t = e.target, c = cls(); if (!c) return;
      if (t.dataset.f === 'pickA') { var s = stu(); if (t.value !== '__draft') { ui.cur[state.tab + vk(state.tab) + '|' + s.id] = t.value; render(); } return; }
      var sh = t.closest('.sheet') || t.closest('.modbar'), a;
      if (t.dataset.f === 'variant' || t.dataset.f === 'sw') { a = curA(state.tab); }
      else if (t.dataset.f === 'date') { a = findAny(c, t.closest('.sheet').dataset.aid); }
      if (t.dataset.f === 'variant') { a.variant = t.value; ensure(c, a); save(); render(); return; }
      if (t.dataset.f === 'sw') {
        var sel = []; document.querySelectorAll('input[data-f="sw"]').forEach(function (x) { if (x.checked) sel.push(x.value); });
        if (!sel.length) { t.checked = true; return; }
        if (sel.length > 2) { var keep = a.sw.filter(function (k) { return sel.indexOf(k) >= 0 && k !== t.value; }).slice(-1); sel = keep.concat([t.value]); }
        a.sw = Object.keys(SW).filter(function (k) { return sel.indexOf(k) >= 0; }); ensure(c, a); save(); render(); return;
      }
      if (t.dataset.f === 'date') { ensure(c, a); a.date = t.value || todayISO(); save(); var op2 = document.querySelector('[data-f="pickA"] option:checked'); if (op2) { op2.value = a.id; op2.textContent = fd(a.date) + ' – ' + (a.thema || 'ohne Thema'); } return; }
      onField(e);
    });

    function parseOldDate(d) {
      d = String(d || '').trim();
      if (/^\d{4}-\d{2}-\d{2}$/.test(d)) return d;
      var m = d.match(/(\d{1,2})\.\s*(\d{1,2})\.?\s*(\d{2,4})?/);
      if (!m) return todayISO();
      var y = m[3] ? (m[3].length === 2 ? 2000 + Number(m[3]) : Number(m[3])) : new Date().getFullYear();
      return y + '-' + p2(Number(m[2])) + '-' + p2(Number(m[1]));
    }
    $('fileSong').addEventListener('change', function (e) {
      var f = e.target.files[0]; if (!f) return;
      var r = new FileReader();
      r.onload = function () {
        try {
          var o = JSON.parse(r.result), c = cls(), items = [], wmap = {};
          var MAPM = { song:['song','de'], lesen_de:['lesen','de'], lesen_es:['lesen','es'], gedicht_de:['gedicht','de'], gedicht_es:['gedicht','es'], gedicht_fs:['gedicht','fs'], abfrage:['abfrage','de'] };
          function npOf(p) { return (p !== null && p !== '' && p !== undefined && !isNaN(Number(p))) ? Math.max(0, Math.min(15, Math.round(Number(p)))) : null; }
          if (o && o.v === 2 && Array.isArray(o.students)) {          /* Songvortrag_Bewertung_Offline */
            var ids = ['s1','s2','s3','s4','s5'];
            o.students.forEach(function (st) {
              var pts = {}; (Array.isArray(st.pts) ? st.pts : []).slice(0, 5).forEach(function (x, i) { var n = npOf(x); if (n !== null) pts[ids[i]] = n; });
              if (String(st.name || '').trim() && Object.keys(pts).length) items.push({ name:String(st.name).trim(), type:'song', variant:'de', sw:[], date:parseOldDate(st.datum), thema:String(st.song || ''), pts:pts, cmt:String(st.cmt || '') });
            });
            var defs = [25,25,20,20,10];
            (Array.isArray(o.weights) ? o.weights : []).slice(0, 5).forEach(function (w, i) { if (Number(w) !== defs[i] && !isNaN(Number(w))) wmap['song:-/' + ids[i]] = Number(w); });
          } else if (o && o.v === 3 && Array.isArray(o.students) && !o.classes) {   /* Bewertung_Offline (Zwischenversion) */
            o.students.forEach(function (st) {
              var nm = String(st.name || '').trim(); if (!nm || !st.r) return;
              Object.keys(st.r).forEach(function (m) {
                var mm = MAPM[m], x = st.r[m] || {}; if (!mm) return;
                var pts = {}; Object.keys(x.pts || {}).forEach(function (k) { var n = npOf(x.pts[k]); if (C[k] && n !== null) pts[k] = n; });
                if (!Object.keys(pts).length) return;
                items.push({ name:nm, type:mm[0], variant:mm[1], sw:(Array.isArray(x.sw) ? x.sw.filter(function (k) { return SW[k]; }).slice(0, 2) : []), date:parseOldDate(x.datum), thema:String(x.thema || ''), pts:pts, cmt:String(x.cmt || '') });
              });
            });
            Object.keys(o.w || {}).forEach(function (m) {
              var mm = MAPM[m]; if (!mm) return;
              var base = mm[0] === 'abfrage' ? 'abfrage' : mm[0] + ':' + (MOD[mm[0]].vars ? (mm[1] === 'fs' ? 'es' : mm[1]) : '-');
              Object.keys(o.w[m] || {}).forEach(function (k) { if (C[k] && !isNaN(Number(o.w[m][k]))) wmap[base + '/' + k] = Number(o.w[m][k]); });
            });
          } else throw new Error('format');
          if (!items.length) { alert('In dieser Sicherung wurden keine ausgefüllten Bewertungen gefunden.'); return; }
          if (!confirm(items.length + ' Bewertung(en) in die Klasse „' + c.name + '“ importieren?\nSchüler/innen werden nach Namen zugeordnet, fehlende neu angelegt.')) return;
          var added = 0, created = 0;
          items.forEach(function (it) {
            var st = null;
            c.students.forEach(function (x) { if (x.name.trim().toLowerCase() === it.name.toLowerCase()) st = x; });
            if (!st) { st = { id:uid('s'), name:it.name }; c.students.push(st); created++; if (!c.stu) c.stu = st.id; }
            if (it.type === 'abfrage' && !it.sw.length) it.sw = ['fach'];
            c.assessments.push({ id:uid('a'), sid:st.id, type:it.type, variant:it.variant, sw:it.type === 'abfrage' ? it.sw : [], date:it.date, thema:it.thema, pts:it.pts, cmt:it.cmt, gew:1 });
            added++;
          });
          Object.keys(wmap).forEach(function (k) { state.w[k] = wmap[k]; });
          save(); render();
          alert(added + ' Bewertung(en) importiert' + (created ? ', ' + created + ' Schüler/in neu angelegt' : '') + '.');
        } catch (err) { alert('Die Datei konnte nicht gelesen werden (erwartet: Sicherung aus „Songvortrag_Bewertung_Offline“ oder „Bewertung_Offline“).'); }
      };
      r.readAsText(f); e.target.value = '';
    });

    $('file').addEventListener('change', function (e) {
      var f = e.target.files[0]; if (!f) return;
      var r = new FileReader();
      r.onload = function () {
        try {
          var o = sanitize(JSON.parse(r.result)); if (!o) throw new Error('leer');
          if (!confirm('Alle aktuellen Daten durch die geladene Sicherung ersetzen?')) return;
          state = o; ui = { draft:{}, cur:{}, fresh:{} }; save(); render();
        } catch (err) { alert('Die Datei konnte nicht gelesen werden (nur Sicherungen aus diesem Tool).'); }
      };
      r.readAsText(f); e.target.value = '';
    });

    render();
  });
})();
</script>
</body>
